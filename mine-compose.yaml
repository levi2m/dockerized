# can be generated by setupmc.com

services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: PURPUR
      VERSION: 1.21.8
      MEMORY: 6144M
      ##
      MAX_PLAYERS: "10"
      MOTD: ==> ==> ==> minezin de levis <== <== <==
      LEVEL: world
      ##
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      USE_SIMD_FLAGS: "true"
      TZ: America/Sao_Paulo
      ##  
      DIFFICULTY: "3"
      FORCE_GAMEMODE: "true"
      VIEW_DISTANCE: "64"
      ##      
      OPS: levi2m
      ENABLE_WHITELIST: "true"
      WHITELIST: levi2m
      LOG_TIMESTAMP: "true"
      ##
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MODRINTH_PROJECTS: |-
        playit-companion
        datapack:dynamic-lights
        plasmo-voice
        thizzyz-tree-feller
      MODRINTH_MODPACK: |-
        create-oneblock
        ##
      ##
    volumes:
      - ./data:/data
networks: {}
